<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de la tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Colores oscuros cálidos (cacao, tierra, lino) */
  :root {
    color-scheme:dark;
    --bg:#16120f; --bg2:#1f1a15; --card:#221c17; --tx:#f1e9df; --mut:#b3a493; --line:#352d25; --line2:#4a3f35;
    --acc:#e6cfb1; --on-acc:#241b13; --acc-soft:#33291f; --ok:#79c995; --ok-soft:#1f3326; --bad:#f19a88; --bad-soft:#3a2420; --warn:#f0bd6c; --warn-soft:#382c18;
    --sombra:0 1px 2px rgba(0,0,0,.35), 0 6px 20px rgba(0,0,0,.18);
    --serif:"Lora", Georgia, serif; --sans:"Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --rojo:#d9534a; --pino:#2f6b4a; --oro:#e9c46a;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--tx); font:15px/1.5 var(--sans); -webkit-font-smoothing:antialiased; }
  a { color:var(--tx); text-underline-offset:2px; }
  /* ---------- estructura: menú a la izquierda (compu) o abajo (celular) */
  #lado { position:fixed; inset:0 auto 0 0; width:228px; background:var(--card); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px; z-index:3; }
  .marca { display:flex; align-items:center; gap:10px; padding:0 8px 18px; }
  .marca .logo { width:34px; height:34px; border-radius:10px; background:var(--acc); color:var(--on-acc); display:grid; place-items:center; font:600 17px var(--serif); }
  .marca b { font:600 17px/1.15 var(--serif); display:block; } .marca small { color:var(--mut); font-size:12px; }
  #nav { display:flex; flex-direction:column; gap:2px; }
  #nav a { display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px; color:var(--mut); text-decoration:none; font-weight:500; }
  #nav a svg { width:19px; height:19px; flex:none; }
  #nav a:hover { background:var(--bg); color:var(--tx); }
  #nav a.on { background:var(--acc); color:var(--on-acc); }
  #estadoTienda { margin-top:auto; padding:12px; border-radius:12px; background:var(--bg); font-size:12px; color:var(--mut); line-height:1.4; }
  #estadoTienda b { color:var(--tx); font-weight:600; display:flex; align-items:center; gap:6px; margin-bottom:2px; }
  .punto { width:8px; height:8px; border-radius:50%; background:var(--mut); display:inline-block; } .punto.ok { background:var(--ok); } .punto.bad { background:var(--bad); }
  #arriba { margin-left:228px; padding:22px 32px 6px; display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  #titulo { font:600 26px/1.2 var(--serif); margin:0; letter-spacing:-.01em; }
  #subtitulo { color:var(--mut); font-size:13px; margin:2px 0 0; }
  main { margin-left:228px; padding:14px 32px 40px; max-width:1240px; }
  @media (max-width:860px) {
    #lado { inset:auto 0 0 0; width:auto; height:auto; flex-direction:row; padding:4px 4px calc(4px + env(safe-area-inset-bottom)); border-right:0; border-top:1px solid var(--line); }
    .marca, #estadoTienda { display:none; }
    #nav { flex-direction:row; width:100%; justify-content:space-between; }
    #nav a { flex:1; flex-direction:column; gap:2px; padding:6px 0; font-size:10.5px; text-align:center; border-radius:10px; }
    #nav a svg { width:21px; height:21px; }
    #arriba { margin-left:0; padding:16px 16px 2px; } #titulo { font-size:22px; }
    main { margin-left:0; padding:10px 16px 96px; }
  }
  /* ---------- piezas */
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 20px; margin-bottom:16px; box-shadow:var(--sombra); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(190px,100%), 1fr)); gap:14px; margin-bottom:16px; }
  .grid > .card { margin-bottom:0; }
  .stat small { color:var(--mut); display:block; font-size:12.5px; }
  .stat > small:first-child { text-transform:uppercase; letter-spacing:.06em; font-size:11px; font-weight:600; margin-bottom:6px; }
  .stat b { font:600 27px/1.15 var(--serif); font-variant-numeric:lining-nums tabular-nums; display:block; margin-bottom:4px; letter-spacing:-.01em; }
  h2 { font:600 17px/1.3 var(--serif); margin:0 0 14px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child > td { border-bottom:0; }
  th { font-size:11px; color:var(--mut); font-weight:600; text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid var(--line2); }
  tbody tr:hover > td { background:color-mix(in srgb, var(--bg) 55%, transparent); }
  .r { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; } .mut { color:var(--mut); } .tiny { font-size:12.5px; }
  .tablebox { overflow-x:auto; margin:0 -8px; padding:0 8px; }
  .tag { display:inline-block; white-space:nowrap; padding:2px 9px; border-radius:99px; font-size:12px; font-weight:500; background:var(--bg2); color:var(--mut); border:0; }
  p.tag { white-space:normal; display:block; border-radius:10px; padding:6px 10px; }
  .tag.ok { color:var(--ok); background:var(--ok-soft); } .tag.bad { color:var(--bad); background:var(--bad-soft); } .tag.warn { color:var(--warn); background:var(--warn-soft); }
  button, input, select { font:inherit; color:inherit; }
  button { background:var(--card); border:1px solid var(--line2); border-radius:10px; padding:8px 14px; cursor:pointer; font-weight:500; transition:background .12s, border-color .12s; }
  button:hover { background:var(--bg); } button:disabled { opacity:.55; cursor:default; }
  button.pri { background:var(--acc); border-color:var(--acc); color:var(--on-acc); } button.pri:hover { filter:brightness(1.12); }
  button.small { padding:4px 10px; font-size:13px; border-radius:8px; }
  input, select { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 11px; width:100%; }
  input:focus, select:focus, button:focus-visible, a:focus-visible { outline:2px solid var(--acc); outline-offset:1px; }
  label { display:block; font-size:12.5px; color:var(--mut); font-weight:500; } label input, label select { margin-top:4px; color:var(--tx); font-weight:400; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .form { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(150px,100%), 1fr)); gap:12px; align-items:end; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--acc); color:var(--on-acc); padding:11px 18px; border-radius:12px; display:none; max-width:90vw; z-index:6; box-shadow:0 8px 30px rgba(0,0,0,.18); font-weight:500; }
  @media (max-width:860px) { #toast { bottom:88px; } }
  .vacio { padding:34px 16px; text-align:center; color:var(--mut); }
  details summary { cursor:pointer; } ul { padding-left:20px; } pre { font-size:12px; }
  /* Inicio */
  .avisos { list-style:none; padding:0; margin:0; }
  .avisos li { display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; background:var(--bg); margin-bottom:8px; }
  .avisos li:last-child { margin-bottom:0; }
  .avisos .ic { width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none; font-weight:700; font-size:14px; }
  .avisos a { margin-left:auto; font-weight:600; white-space:nowrap; }
  .ultima { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .ultima:last-child { border-bottom:0; }
  .ultima .q { width:36px; height:36px; border-radius:10px; background:var(--acc-soft); display:grid; place-items:center; flex:none; color:var(--tx); }
  .ultima .q svg { width:18px; height:18px; }
  .ultima div { min-width:0; flex:1; } .ultima div span { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .entrar { min-height:100vh; display:grid; place-items:center; padding:16px; }
  .entrar .card { width:min(400px, 100%); padding:28px; }
  /* ---------- Navidad: solo del 15/11 al 6/1 (o si se prende a mano) */
  body.navidad { --acc:#e9c46a; --on-acc:#1d1710; --acc-soft:#2b2a1c; background:radial-gradient(1200px 500px at 70% -10%, rgba(47,107,74,.18), transparent 70%), var(--bg); background-attachment:fixed; }
  body.navidad .marca .logo { background:var(--rojo); color:#fff; position:relative; }
  body.navidad .marca .logo::after { content:""; position:absolute; top:-7px; right:-6px; width:16px; height:12px; background:var(--rojo); border-radius:3px 10px 2px 2px; transform:rotate(22deg); box-shadow:inset 0 -3px 0 #fff; }
  body.navidad .marca .logo::before { content:""; position:absolute; top:-11px; right:-9px; width:7px; height:7px; border-radius:50%; background:#fff; z-index:1; }
  #guirnalda { display:none; }
  body.navidad #guirnalda { display:flex; position:fixed; top:0; left:228px; right:0; height:22px; justify-content:space-around; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse 50% 14px at 50% 0, transparent 92%, var(--line2) 94%, transparent 100%) 0 -4px / 60px 22px repeat-x; }
  #guirnalda i { width:7px; height:11px; border-radius:50% 50% 45% 45%; margin-top:9px; background:var(--c); box-shadow:0 0 8px 1px var(--c); animation:titila 2.4s ease-in-out infinite; }
  #guirnalda i:nth-child(4n+1) { --c:#e8574b; } #guirnalda i:nth-child(4n+2) { --c:#e9c46a; animation-delay:.6s; }
  #guirnalda i:nth-child(4n+3) { --c:#5cc08a; animation-delay:1.2s; } #guirnalda i:nth-child(4n) { --c:#7fb4ff; animation-delay:1.8s; }
  @keyframes titila { 50% { opacity:.35; box-shadow:none; } }
  body.navidad #arriba { padding-top:34px; }
  #nieve { position:fixed; inset:0; pointer-events:none; z-index:1; overflow:hidden; display:none; }
  body.navidad #nieve { display:block; }
  body.navidad main, body.navidad #arriba { position:relative; z-index:2; }
  #nieve i { position:absolute; top:-12px; border-radius:50%; background:#fff; opacity:.55; animation:cae linear infinite; }
  @keyframes cae { to { transform:translate3d(var(--x), 105vh, 0); } }
  @media (prefers-reduced-motion: reduce) { #nieve { display:none !important; } #guirnalda i { animation:none; } }
  .fiestas { position:relative; overflow:hidden; border-color:color-mix(in srgb, var(--oro) 35%, var(--line)); background:linear-gradient(120deg, #1d3a2a, #2a1d17 70%); }
  .fiestas h2 { color:var(--oro); margin-bottom:4px; } .fiestas p { margin:0; color:#e8ddcf; }
  .fiestas .cuenta { font:600 34px/1 var(--serif); color:#fff; } .fiestas .cuenta small { font:500 13px var(--sans); color:#cbbfae; display:block; margin-top:4px; }
  .fiestas .arbol { position:absolute; right:14px; bottom:-6px; width:84px; opacity:.9; }
  #fiestasBoton { margin-top:10px; width:100%; font-size:12px; padding:6px 8px; color:var(--mut); background:transparent; }
  .solo-cel { display:none; }
  @media (max-width:860px) { #fiestasBoton { display:none; } .solo-cel { display:inline-block; margin-top:10px; } .grid { grid-template-columns:repeat(auto-fit, minmax(min(150px,100%), 1fr)); gap:10px; } .stat b { font-size:21px; } .card { padding:16px; } body.navidad #guirnalda { left:0; } .fiestas .arbol { width:60px; opacity:.5; } }
</style>
</head>
<body>
<aside id="lado">
  <div class="marca"><span class="logo">T</span><span><b>Panel</b><small>de la tienda</small></span></div>
  <nav id="nav"></nav>
  <div id="estadoTienda"></div>
  <button id="fiestasBoton" type="button" hidden></button>
</aside>
<div id="guirnalda" aria-hidden="true"></div>
<div id="nieve" aria-hidden="true"></div>
<div id="arriba"><div><h1 id="titulo"></h1><p id="subtitulo"></p></div><div id="acciones"></div></div>
<main id="vista"></main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n < 0 ? '−' : '') + '$ ' + Math.abs(Number(n || 0)).toLocaleString('es-AR', { maximumFractionDigits: Math.abs(n) >= 1000 ? 0 : 2 });
const fq = n => Number(n || 0).toLocaleString('es-AR', { maximumFractionDigits: 3 });
const fecha = ms => ms ? new Date(ms).toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' }) : '—';
const S = { carrito: [], token: '' };
const TZ = -new Date().getTimezoneOffset();  // minutos respecto de UTC (Argentina: -180)
const dia = ms => new Date(ms).toLocaleDateString('es-AR', { weekday: 'short', day: 'numeric', month: 'short' });
const pct = (a, b) => b ? Math.round((a - b) / Math.abs(b) * 100) : null;
try { S.token = localStorage.getItem('panel-token') || ''; } catch (e) {}

const ic = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONOS = {
  inicio: ic('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>'),
  ventas: ic('<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'),
  productos: ic('<path d="M21 8 12 3 3 8l9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'),
  vender: ic('<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2.5 3h3l2.6 12.2a1 1 0 0 0 1 .8h9.3a1 1 0 0 0 1-.8L21 7H6.2"/>'),
  balances: ic('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),
  clientes: ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 20a6.5 6.5 0 0 0-3-5.5"/>'),
  conexion: ic('<path d="M9 7V3M15 7V3"/><path d="M6 7h12v4a6 6 0 0 1-12 0z"/><path d="M12 17v4"/>'),
};
const VISTAS = [
  ['inicio', 'Inicio', 'Cómo viene la tienda hoy'], ['ventas', 'Ventas', 'Todo lo vendido, por la web y por fuera'],
  ['productos', 'Productos', 'Stock, costos y precios'], ['vender', 'Vender', 'Ventas por fuera de la web: WhatsApp, en mano'],
  ['balances', 'Balances', 'Ganancia, gastos e inversión'], ['clientes', 'Clientes', 'Quién compra y cuánto'],
  ['conexion', 'Conexión', 'Tiendanube y sincronización'],
];
document.getElementById('nav').innerHTML = VISTAS.map(([k, n]) => `<a href="#${k}" data-v="${k}">${ICONOS[k]}<span>${n}</span></a>`).join('');

async function estadoLateral() {
  try {
    const e = await api('/api/estado?tz=' + TZ);
    const m = e.ultima_traida ? Math.round((Date.now() - e.ultima_traida) / 60000) : null;
    $('#estadoTienda').innerHTML = e.conectada
      ? `<b><span class="punto ${e.error_traer ? 'bad' : 'ok'}"></span>${e.error_traer ? 'Problema al traer ventas' : 'Tiendanube conectada'}</b>${m === null ? 'Todavía sin traer ventas' : 'Ventas al día ' + (m < 1 ? 'recién' : `hace ${m} min`)}`
      : `<b><span class="punto"></span>Sin conectar</b><a href="#conexion">Conectar Tiendanube</a>`;
    return e;
  } catch (err) { return null; }
}

function toast(t) { const el = $('#toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 3500); }

async function api(ruta, metodo = 'GET', cuerpo) {
  const r = await fetch(ruta, { method: metodo, headers: { 'Authorization': 'Bearer ' + S.token, 'Content-Type': 'application/json' }, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  if (r.status === 401) { S.token = ''; try { localStorage.removeItem('panel-token'); } catch (e) {} render(); throw new Error('Clave incorrecta'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail ? (typeof d.detail === 'string' ? d.detail : 'Datos inválidos') : 'Error ' + r.status);
  return d;
}
const fallo = e => toast(e.message || String(e));

function login() {
  document.body.classList.add('fuera');
  $('#lado').style.display = 'none'; $('#arriba').style.display = 'none';
  $('#vista').style.margin = '0'; $('#vista').style.padding = '0'; $('#vista').style.maxWidth = 'none';
  $('#vista').innerHTML = `<div class="entrar"><div class="card"><div class="marca" style="padding:0 0 18px"><span class="logo">T</span><span><b>Panel</b><small>de la tienda</small></span></div>
    <form id="fLogin"><label>Clave<input id="clave" type="password" autocomplete="current-password" required autofocus></label>
    <p class="tiny mut">Es la que aparece en la terminal al arrancar con <code>iniciar.sh</code>.</p>
    <p style="margin-bottom:0"><button class="pri" style="width:100%">Entrar</button></p></form></div></div>`;
  $('#fLogin').onsubmit = async e => { e.preventDefault(); S.token = $('#clave').value.trim(); try { await api('/api/estado'); try { localStorage.setItem('panel-token', S.token); } catch (e) {} render(); } catch (e) { fallo(e); } };
}

async function render() {
  if (!S.token) return login();
  if (document.body.classList.contains('fuera')) {
    document.body.classList.remove('fuera');
    $('#lado').style.display = ''; $('#arriba').style.display = ''; ['margin', 'padding', 'maxWidth'].forEach(k => $('#vista').style[k] = '');
  }
  let v = (location.hash || '#inicio').slice(1);
  if (!VISTAS.some(x => x[0] === v)) v = 'inicio';
  const info = VISTAS.find(x => x[0] === v);
  $('#titulo').textContent = info[1]; $('#subtitulo').textContent = info[2]; $('#acciones').innerHTML = '';
  document.title = info[1] + ' · Panel de la tienda';
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  if (!S.ultEstado || Date.now() - S.ultEstado > 30000) { S.ultEstado = Date.now(); estadoLateral(); }
  try { await ({ inicio, ventas, productos, vender, balances, clientes, conexion }[v] || inicio)(); } catch (e) { fallo(e); }
}
window.onhashchange = render;

// ---------- Fiestas: se prenden solas del 15/11 al 6/1. El botón del menú las apaga o prende (queda guardado en esta compu).
const enTemporada = (d => { const m = d.getMonth(), n = d.getDate(); return (m === 10 && n >= 15) || m === 11 || (m === 0 && n <= 6); })(new Date());
function fiestasPrendidas() { let v = null; try { v = localStorage.getItem('panel-fiestas'); } catch (e) {} return v === null ? enTemporada : v === '1'; }
function aplicarFiestas() {
  const on = fiestasPrendidas();
  document.body.classList.toggle('navidad', on);
  const b = $('#fiestasBoton'); b.hidden = !enTemporada && !on; b.textContent = on ? '❄ Apagar adornos de fiestas' : '❄ Prender adornos de fiestas';
  if (on && !$('#guirnalda').children.length) {
    $('#guirnalda').innerHTML = '<i></i>'.repeat(26);
    $('#nieve').innerHTML = Array.from({ length: 34 }, () => { const t = 2 + Math.random() * 3.5; return `<i style="left:${(Math.random() * 100).toFixed(1)}%;width:${t}px;height:${t}px;--x:${Math.round(Math.random() * 80 - 40)}px;animation-duration:${(9 + Math.random() * 12).toFixed(1)}s;animation-delay:-${(Math.random() * 20).toFixed(1)}s"></i>`; }).join('');
  }
}
$('#fiestasBoton').onclick = () => { try { localStorage.setItem('panel-fiestas', fiestasPrendidas() ? '0' : '1'); } catch (e) {} aplicarFiestas(); if ((location.hash || '#inicio') === '#inicio') render(); };
const ARBOL = '<svg class="arbol" viewBox="0 0 80 100" aria-hidden="true"><path d="M40 4 62 38H52l18 26H58l16 22H6l16-22H10l18-26H18z" fill="#2f6b4a"/><rect x="34" y="86" width="12" height="12" rx="2" fill="#6b4a32"/><circle cx="40" cy="6" r="5" fill="#e9c46a"/><circle cx="32" cy="40" r="3" fill="#e8574b"/><circle cx="50" cy="56" r="3" fill="#e9c46a"/><circle cx="28" cy="70" r="3" fill="#7fb4ff"/><circle cx="54" cy="78" r="3" fill="#e8574b"/></svg>';
function cartelFiestas() {
  if (!document.body.classList.contains('navidad')) return '';
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const nav = new Date(hoy.getMonth() === 0 ? hoy.getFullYear() - 1 : hoy.getFullYear(), 11, 25);
  const faltan = Math.round((nav - hoy) / 864e5);
  let txt, cuenta = '';
  if (faltan > 0) { txt = 'Se vienen las fiestas: buena época para destacar regalos y combos en la tienda.'; cuenta = `<div class="cuenta">${faltan}<small>${faltan === 1 ? 'día' : 'días'} para Navidad</small></div>`; }
  else if (faltan === 0) txt = '¡Feliz Navidad! Que hoy vengan muchas ventas.';
  else if (hoy.getMonth() === 11) txt = 'Que el año nuevo llegue con muchas ventas.';
  else txt = '¡Feliz año nuevo! Que sea un gran año para la tienda.';
  return `<div class="card fiestas"><div class="row" style="gap:20px;align-items:center;padding-right:70px">${cuenta}<div><h2>¡Felices fiestas!</h2><p>${txt}</p><button class="small solo-cel" data-fiestas>Apagar adornos</button></div></div>${ARBOL}</div>`;
}

// ---------- Ventas
const ENVIO = { unpacked: ['Sin preparar', 'warn'], unshipped: ['Sin enviar', 'warn'], partially_packed: ['Preparando', 'warn'], partially_fulfilled: ['Enviado en parte', 'warn'], shipped: ['Enviado', 'ok'], delivered: ['Entregado', 'ok'] };

const fila2 = (k, v) => v || v === 0 ? `<tr><td class="mut" style="width:38%">${k}</td><td>${v}</td></tr>` : '';

    <div><b>Plata</b><table class="tiny">${fila2('Subtotal', v.subtotal ? fmt(v.subtotal) : '')}${fila2('Envío cobrado', v.envio ? fmt(v.envio) : '')}${fila2('Descuento', v.descuento ? '−' + fmt(v.descuento) : '')}${ds.cupones && ds.cupones.length ? fila2('Cupón', esc(ds.cupones.join(', ')) + (ds.cupon ? ' (−' + fmt(ds.cupon) + ')' : '')) : ''}${fila2('Desc. por medio de pago', ds.medio_pago ? '−' + fmt(ds.medio_pago) : '')}
      ${fila2('<b>Total cobrado</b>', '<b>' + fmt(v.total) + '</b>')}${fila2('Costo mercadería', '−' + fmt(v.costo))}${fila2('Envío que paga la tienda', v.envio_costo ? '−' + fmt(v.envio_costo) : '')}${fila2('<b>Ganancia</b>', '<b>' + fmt(gan) + '</b>' + (v.total ? ` <span class="mut">(${Math.round(gan / v.total * 100)}%)</span>` : ''))}</table></div>
    <div><b>Pago y horarios</b><table class="tiny">${fila2('Medio', esc(v.medio_pago))}${fila2('Forma', esc(PAGO[pg.metodo] || pg.metodo || ''))}${fila2('Tarjeta', esc(pg.tarjeta || ''))}${fila2('Cuotas', pg.cuotas && pg.cuotas > 1 ? pg.cuotas : '')}${fila2('N° de operación', esc(pg.operacion || ''))}
      ${fila2('Pedido hecho', d.creado_ts ? fecha(d.creado_ts) : '')}${fila2('Pagado', d.pagado_ts ? fecha(d.pagado_ts) : (v.origen === 'mostrador' ? fecha(v.ts) : ''))}${fila2('Enviado', d.enviado_ts ? fecha(d.enviado_ts) : '')}${fila2('Anulada', v.anulada_ts ? fecha(v.anulada_ts) : '')}</table></div>
    <div><b>Cliente</b><table class="tiny">${fila2('Nombre', esc(c.nombre))}${fila2('Email', esc(c.email))}${fila2('Teléfono', esc(c.telefono))}${fila2('DNI/CUIT', esc(c.documento || f.documento || ''))}${fila2('Factura a', f.nombre && f.nombre !== c.nombre ? esc(f.nombre) : '')}${fila2('Nota del cliente', esc(d.nota_cliente || ''))}${fila2('Nota', esc(d.nota_tienda || ''))}</table></div>
    ${e.metodo || e.direccion ? `<div><b>Envío</b><table class="tiny">${fila2('Estado', ENVIO[d.estado_envio] ? `<span class="tag ${ENVIO[d.estado_envio][1]}">${ENVIO[d.estado_envio][0]}</span>` : esc(d.estado_envio || ''))}${fila2('Método', esc(e.metodo))}${fila2('Recibe', esc(e.destinatario))}${fila2('Dirección', esc([e.direccion, e.localidad, e.ciudad, e.provincia, e.cp].filter(Boolean).join(', ')))}${fila2('Teléfono', esc(e.telefono))}${fila2('Seguimiento', e.seguimiento ? (e.seguimiento_url ? `<a href="${esc(e.seguimiento_url)}" target="_blank" rel="noopener">${esc(e.seguimiento)}</a>` : esc(e.seguimiento)) : '')}</table></div>` : ''}

    <form class="form" id="fVenta" style="margin-top:12px"><label>Medio de pago<select id="medio"><option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Débito</option><option>Crédito</option></select></label>
    <label>Descuento ($)<input id="desc" type="number" min="0" step="0.01" value="0"></label><label>Cliente (opcional)<input id="cli"></label>

    <div><div style="font-size:20px;margin-bottom:6px"><b>${fmt(total)}</b></div><button class="pri">Cobrar</button></div></form>` : '<p class="mut">Para ventas por fuera de la web (WhatsApp, en mano). Buscá un producto y tocá para agregarlo. El stock baja acá y en Tiendanube. Si cargás el teléfono o email, el cliente queda en Clientes.</p>'}</div></div>`;
  const qi = $('#qv'); qi.oninput = () => { S.qv = qi.value; clearTimeout(qi.t); qi.t = setTimeout(() => vender().then(() => { const n = $('#qv'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }), 200); };

// ---------- Balances
function periodo() {
  const hoy = new Date(); hoy.setHours(0, 0, 0, 0);
  const t = S.per || 'mes', mañana = new Date(hoy); mañana.setDate(hoy.getDate() + 1);
  if (t === 'mes') return [new Date(hoy.getFullYear(), hoy.getMonth(), 1), mañana, 'Este mes'];
  if (t === 'mesant') return [new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1), new Date(hoy.getFullYear(), hoy.getMonth(), 1), 'Mes pasado'];
  if (t === '7') { const d = new Date(hoy); d.setDate(d.getDate() - 6); return [d, mañana, 'Últimos 7 días']; }
  if (t === '30') { const d = new Date(hoy); d.setDate(d.getDate() - 29); return [d, mañana, 'Últimos 30 días']; }
  if (t === 'año') return [new Date(hoy.getFullYear(), 0, 1), mañana, 'Este año'];
  if (t === 'todo') return [new Date(2020, 0, 1), mañana, 'Desde el principio'];
  const d = S.perDesde ? new Date(S.perDesde + 'T00:00') : hoy, h = S.perHasta ? new Date(S.perHasta + 'T00:00') : hoy; h.setDate(h.getDate() + 1);
  return [d, h, 'Elegido'];
}
const cambio = (a, b) => { const p = pct(a, b); return p === null ? '' : `<small class="${p >= 0 ? 'ok' : 'bad'}" style="color:var(--${p >= 0 ? 'ok' : 'bad'})">${p >= 0 ? '▲' : '▼'} ${Math.abs(p)}% vs. período anterior</small>`; };
async function balances() {
  const [d, h, nombre] = periodo();
  const [b, movs, ps] = await Promise.all([api(`/api/balance?desde=${+d}&hasta=${+h}&tz=${TZ}`), api(`/api/plata?desde=${+d}&hasta=${+h}`), S.productos ? S.productos : api('/api/productos')]);
  S.productos = ps; S.compra = S.compra || [];
  const maxDia = Math.max(1, ...b.por_dia.map(x => x.ingresos));
  const tabla = (filas, cols) => filas.length ? `<div class="tablebox"><table><thead><tr>${cols.map(c => `<th class="${c[2] || ''}">${c[0]}</th>`).join('')}</tr></thead><tbody>${filas.map(f => `<tr>${cols.map(c => `<td class="${c[2] || ''}">${c[1](f)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>` : '<p class="mut">Sin datos en este período.</p>';
  $('#vista').innerHTML = `
  <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Balance · ${nombre}</h2>
    <div class="row"><select id="per" style="width:auto">${[['mes', 'Este mes'], ['mesant', 'Mes pasado'], ['7', 'Últimos 7 días'], ['30', 'Últimos 30 días'], ['año', 'Este año'], ['todo', 'Desde el principio'], ['elegir', 'Elegir fechas…']].map(([k, n]) => `<option value="${k}"${(S.per || 'mes') === k ? ' selected' : ''}>${n}</option>`).join('')}</select>
    ${S.per === 'elegir' ? `<input type="date" id="pd" value="${S.perDesde || ''}" style="width:auto"><input type="date" id="ph" value="${S.perHasta || ''}" style="width:auto">` : ''}</div></div>
    <p class="tiny mut" style="margin:6px 0 0">${d.toLocaleDateString('es-AR')} al ${new Date(+h - 1).toLocaleDateString('es-AR')}</p></div>
  <div class="grid">
    <div class="card stat"><small>Ventas</small><b>${fmt(b.ingresos)}</b><small>${b.ventas} venta(s) · ticket promedio ${fmt(b.ticket_promedio)}</small>${cambio(b.ingresos, b.anterior.ingresos)}</div>
    <div class="card stat"><small>Ganancia bruta</small><b>${fmt(b.ganancia_bruta)}</b><small>margen ${b.margen}%</small></div>
    <div class="card stat"><small>Gastos</small><b>${fmt(b.gastos)}</b><small>publicidad, comisiones, etc.</small></div>
    <div class="card stat"><small>Ganancia neta</small><b style="color:var(--${b.ganancia_neta >= 0 ? 'ok' : 'bad'})">${fmt(b.ganancia_neta)}</b>${cambio(b.ganancia_neta, b.anterior.ganancia_neta)}</div>
  </div>
  ${b.lineas_sin_costo || b.stock.productos_sin_costo ? `<div class="card"><span class="tag warn">Ojo</span> ${b.lineas_sin_costo ? `${b.lineas_sin_costo} producto(s) vendido(s) en este período no tenían costo cargado, así que la ganancia sale más alta de lo real. ` : ''}${b.stock.productos_sin_costo ? `Hay ${b.stock.productos_sin_costo} producto(s) sin costo: cargalo en <a href="#productos">Productos</a>.` : ''}</div>` : ''}
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))">
    <div class="card"><h2>Cómo se llega a la ganancia</h2><table>
      <tr><td>Lo que se cobró</td><td class="r">${fmt(b.ingresos)}</td></tr>
      <tr><td class="mut">− Lo que costó la mercadería vendida</td><td class="r">−${fmt(b.costo_mercaderia)}</td></tr>
      <tr><td class="mut">− Envíos que pagó la tienda</td><td class="r">−${fmt(b.envios)}</td></tr>
      <tr><td><b>= Ganancia bruta</b></td><td class="r"><b>${fmt(b.ganancia_bruta)}</b></td></tr>
      <tr><td class="mut">− Gastos</td><td class="r">−${fmt(b.gastos)}</td></tr>
      <tr><td><b>= Ganancia neta</b></td><td class="r"><b>${fmt(b.ganancia_neta)}</b></td></tr>
      <tr><td class="tiny mut" colspan="2">Descuentos y cupones dados: ${fmt(b.descuentos)} (ya restados de lo cobrado).</td></tr></table></div>
    <div class="card"><h2>Inversión y mercadería</h2><table>
      <tr><td>Compras de mercadería en el período</td><td class="r">${fmt(b.compras)}</td></tr>
      <tr><td>Otras inversiones en el período</td><td class="r">${fmt(b.inversiones)}</td></tr>
      <tr><td><b>Mercadería en stock hoy (a costo)</b><br><span class="tiny mut">la plata que está "parada" en el depósito</span></td><td class="r"><b>${fmt(b.stock.valor_costo)}</b></td></tr>
      <tr><td>La misma mercadería a precio de venta</td><td class="r">${fmt(b.stock.valor_venta)}</td></tr>
      <tr><td class="mut">Ganancia si se vende todo</td><td class="r">${fmt(b.stock.valor_venta - b.stock.valor_costo)}</td></tr>
      <tr><td class="tiny mut" colspan="2">${fq(b.stock.unidades)} unidades en stock · ${b.stock.sin_stock} producto(s) agotado(s)</td></tr></table></div>
  </div>
  <div class="card"><h2>Ventas por día</h2>${tabla(b.por_dia.slice().reverse(), [['Día', x => dia(x.dia)], ['', x => `<div style="background:var(--acc);height:10px;border-radius:4px;width:${Math.max(2, x.ingresos / maxDia * 100)}%;min-width:2px"></div>`], ['Ventas', x => x.ventas, 'r'], ['Cobrado', x => fmt(x.ingresos), 'r'], ['Ganancia', x => fmt(x.ganancia), 'r']])}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))">
    <div class="card"><h2>Por dónde se vendió</h2>${tabla(b.por_origen, [['Canal', x => esc(x.nombre)], ['Ventas', x => x.ventas, 'r'], ['Cobrado', x => fmt(x.ingresos), 'r'], ['Ganancia', x => fmt(x.ganancia), 'r']])}</div>
    <div class="card"><h2>Por medio de pago</h2>${tabla(b.por_medio_pago, [['Medio', x => esc(x.nombre)], ['Ventas', x => x.ventas, 'r'], ['Cobrado', x => fmt(x.ingresos), 'r']])}</div>
  </div>
  <div class="card"><h2>Productos que más se vendieron</h2>${tabla(b.productos, [['Producto', x => esc(x.nombre)], ['Unidades', x => fq(x.unidades), 'r'], ['Cobrado', x => fmt(x.ingresos), 'r'], ['Ganancia', x => fmt(x.ganancia), 'r']])}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))">
    <div class="card"><h2>Cargar gasto o inversión</h2><form class="form" id="fPlata">
      <label>Tipo<select id="pl_tipo"><option value="gasto">Gasto</option><option value="inversion">Inversión</option></select></label>
      <label>Categoría<input id="pl_cat" list="cats" placeholder="Publicidad"><datalist id="cats">${['Publicidad', 'Comisión Mercado Pago', 'Plan Tiendanube', 'Envíos', 'Embalaje', 'Sueldos', 'Impuestos', 'Alquiler', 'Servicios', 'Otros'].map(x => `<option>${x}</option>`).join('')}</datalist></label>
      <label>Detalle<input id="pl_con" required placeholder="Ej: campaña de Instagram"></label>
      <label>Monto<input id="pl_monto" type="number" min="0.01" step="0.01" required></label>
      <label>Fecha<input id="pl_fecha" type="date"></label>
      <div><button class="pri">Guardar</button></div></form>
      <p class="tiny mut">Gasto: lo que se va todos los meses (publicidad, comisiones, el plan de Tiendanube). Inversión: algo que queda (estantería, máquina, fotos de producto). La mercadería se carga al lado, en Compras.</p></div>
    <div class="card"><h2>Cargar compra de mercadería</h2><form id="fCompra">
      ${S.compra.length ? `<table class="tiny">${S.compra.map((l, n) => `<tr><td>${esc(l.nombre)}</td><td class="r">${fq(l.cantidad)} × ${fmt(l.costo_unitario)}</td><td><button type="button" class="small" data-qc="${n}">✕</button></td></tr>`).join('')}</table>` : ''}
      <div class="form"><label>Producto<select id="co_p"><option value="">Elegir…</option>${ps.map(x => `<option value="${x.id}">${esc(x.nombre)}</option>`).join('')}</select></label>
      <label>Cantidad<input id="co_c" type="number" min="1" step="1"></label><label>Costo por unidad<input id="co_u" type="number" min="0" step="0.01"></label>
      <div><button type="button" id="co_add">Agregar</button></div></div>
      <div class="form" style="margin-top:10px"><label>Proveedor<input id="co_prov"></label><label>Flete, aduana, etc. ($)<input id="co_extra" type="number" min="0" step="0.01" value="0"></label><label>Fecha<input id="co_fecha" type="date"></label>
      <div><button class="pri"${S.compra.length ? '' : ' disabled'}>Guardar compra</button></div></div></form>
      <p class="tiny mut">Suma el stock (acá y en Tiendanube) y recalcula el costo de cada producto con el promedio. El flete se reparte entre los productos.</p></div>
  </div>
  <div class="card"><h2>Gastos, inversiones y compras del período</h2>${tabla(movs, [['Fecha', x => `<span class="tiny">${fecha(x.ts)}</span>`], ['Tipo', x => `<span class="tag${x.tipo === 'gasto' ? ' warn' : ''}">${{ gasto: 'Gasto', inversion: 'Inversión', compra: 'Compra' }[x.tipo]}</span>${x.anulado ? ' <span class="tag bad">anulado</span>' : ''}`], ['Detalle', x => esc([x.categoria !== 'Mercadería' && x.categoria, x.concepto].filter(Boolean).join(' · ')) + (x.items.length ? `<div class="tiny mut">${x.items.map(i => `${fq(i.cantidad)} × ${esc(i.nombre)} a ${fmt(i.costo_unitario)}`).join('<br>')}</div>` : '')], ['Monto', x => fmt(x.monto), 'r'], ['', x => x.anulado ? '' : `<button class="small" data-anp="${x.id}">Anular</button>`]])}</div>`;
  $('#per').onchange = () => { S.per = $('#per').value; balances(); };
  if ($('#pd')) { $('#pd').onchange = () => { S.perDesde = $('#pd').value; balances(); }; $('#ph').onchange = () => { S.perHasta = $('#ph').value; balances(); }; }
  const aMs = v => v ? +new Date(v + 'T12:00') : undefined;
  $('#fPlata').onsubmit = async ev => { ev.preventDefault(); try { await api('/api/plata', 'POST', { tipo: $('#pl_tipo').value, categoria: $('#pl_cat').value.trim(), concepto: $('#pl_con').value.trim(), monto: Number($('#pl_monto').value), fecha_ms: aMs($('#pl_fecha').value) }); toast('Guardado'); balances(); } catch (e) { fallo(e); } };
  $('#co_add').onclick = () => { const id = +$('#co_p').value, c = Number($('#co_c').value), u = Number($('#co_u').value); if (!id || !(c > 0) || !($('#co_u').value !== '')) return toast('Elegí producto, cantidad y costo'); S.compra.push({ producto_id: id, nombre: ps.find(x => x.id === id).nombre, cantidad: c, costo_unitario: u }); balances(); };
  document.querySelectorAll('[data-qc]').forEach(x => x.onclick = () => { S.compra.splice(+x.dataset.qc, 1); balances(); });
  $('#fCompra').onsubmit = async ev => { ev.preventDefault(); try { const r = await api('/api/compras', 'POST', { items: S.compra.map(({ producto_id, cantidad, costo_unitario }) => ({ producto_id, cantidad, costo_unitario })), proveedor: $('#co_prov').value.trim(), extra: Number($('#co_extra').value || 0), fecha_ms: aMs($('#co_fecha').value) }); S.compra = []; S.productos = null; toast('Compra guardada: ' + fmt(r.monto)); balances(); } catch (e) { fallo(e); } };
  document.querySelectorAll('[data-anp]').forEach(x => x.onclick = async () => { if (x.dataset.ok !== '1') { x.dataset.ok = '1'; x.textContent = '¿Seguro?'; return; } try { await api(`/api/plata/${x.dataset.anp}/anular`, 'POST'); S.productos = null; toast('Anulado'); balances(); } catch (e) { fallo(e); } });
}

// ---------- Clientes
async function clientes() {
  const cs = await api('/api/clientes');
  const q = (S.qCli || '').toLowerCase();
  const lista = cs.filter(c => !q || [c.nombre, c.email, c.telefono, c.ciudad, c.documento].join(' ').toLowerCase().includes(q));
  const total = cs.reduce((a, c) => a + c.total, 0), repiten = cs.filter(c => c.compras > 1).length;
  $('#vista').innerHTML = `<div class="grid">
    <div class="card stat"><small>Clientes</small><b>${cs.length}</b><small>con nombre, teléfono o email</small></div>
    <div class="card stat"><small>Volvieron a comprar</small><b>${repiten}</b><small>${cs.length ? Math.round(repiten / cs.length * 100) : 0}% del total</small></div>
    <div class="card stat"><small>Gasto promedio por cliente</small><b>${fmt(cs.length ? total / cs.length : 0)}</b><small>sumando todas sus compras</small></div></div>
  <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Clientes</h2>
    <div class="row"><input id="qCli" placeholder="Buscar nombre, teléfono, ciudad…" style="max-width:260px" value="${esc(S.qCli || '')}"><button id="csv">Descargar lista</button></div></div>
  ${lista.length ? `<div class="tablebox"><table><thead><tr><th>Cliente</th><th>Contacto</th><th>Ciudad</th><th class="r">Compras</th><th class="r">Total</th><th>Última compra</th></tr></thead><tbody>
  ${lista.map(c => `<tr><td><details><summary><b>${esc(c.nombre || '(sin nombre)')}</b>${c.compras > 1 ? ' <span class="tag ok">repite</span>' : ''}</summary>
      <ul class="tiny">${c.ventas.map(v => `<li>${fecha(v.ts)} · ${v.origen === 'web' ? 'Web #' + esc(v.numero) : 'Por fuera'} · <b>${fmt(v.total)}</b><br><span class="mut">${v.items.map(esc).join(', ')}</span></li>`).join('')}</ul>
      ${c.documento ? `<div class="tiny mut">DNI/CUIT ${esc(c.documento)}</div>` : ''}<div class="tiny mut">Cliente desde ${fecha(c.primera)} · promedio ${fmt(c.promedio)} por compra</div></details></td>
    <td class="tiny">${c.telefono ? `<a href="https://wa.me/${esc(String(c.telefono).replace(/\D/g, ''))}" target="_blank" rel="noopener">${esc(c.telefono)}</a><br>` : ''}${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : ''}</td>
    <td class="tiny">${esc([c.ciudad, c.provincia].filter(Boolean).filter((x, i, a) => a.indexOf(x) === i).join(', '))}</td>
    <td class="r">${c.compras}</td><td class="r">${fmt(c.total)}</td><td class="tiny">${fecha(c.ultima)}<br>${c.origenes.map(o => o === 'web' ? '<span class="tag ok">web</span>' : '<span class="tag">por fuera</span>').join(' ')}</td></tr>`).join('')}
  </tbody></table></div>` : '<div class="vacio">Todavía no hay clientes. Aparecen solos con cada venta web, o cuando cargás nombre, teléfono o email en una venta por fuera.</div>'}</div>`;
  const qi = $('#qCli'); qi.oninput = () => { S.qCli = qi.value; clearTimeout(qi.t); qi.t = setTimeout(() => clientes().then(() => { const n = $('#qCli'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }), 250); };
  $('#csv').onclick = () => {
    const filas = [['Nombre', 'Email', 'Teléfono', 'DNI/CUIT', 'Ciudad', 'Provincia', 'Compras', 'Total', 'Primera compra', 'Última compra']].concat(cs.map(c => [c.nombre, c.email, c.telefono, c.documento, c.ciudad, c.provincia, c.compras, c.total, new Date(c.primera).toLocaleDateString('es-AR'), new Date(c.ultima).toLocaleDateString('es-AR')]));
    const csv = '﻿' + filas.map(f => f.map(x => '"' + String(x ?? '').replace(/"/g, '""') + '"').join(';')).join('\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'clientes.csv'; a.click(); URL.revokeObjectURL(a.href);
  };
}

// ---------- Conexión con Tiendanube
async function conexion() {
  const [e, avs] = await Promise.all([api('/api/estado?tz=' + TZ), api('/api/avisos?limite=30')]);
  const hace = ms => { if (!ms) return 'nunca'; const m = Math.round((Date.now() - ms) / 60000); return m < 1 ? 'recién' : m < 60 ? `hace ${m} min` : fecha(ms); };
  $('#vista').innerHTML = `<div class="card"><h2>Tiendanube</h2>
    <p>${e.conectada ? `<span class="tag ok">Conectada</span> Tienda N° ${esc(e.tienda_id)}` : '<span class="tag bad">Sin conectar</span>'}</p>
    ${!e.configurada ? '<p class="tag warn">Faltan los datos de la app (TN_APP_ID y TN_APP_SECRETO). Ver docs/PASOS.md.</p>' : ''}
    ${e.conectada ? `<p>Ventas traídas de Tiendanube: <b>${hace(e.ultima_traida)}</b>. <span class="mut">La app las busca sola al prenderse y cada ${e.traer_cada_min} min mientras está abierta.</span></p>
      ${e.error_traer ? `<p><span class="tag bad">No se pudo traer</span> <span class="tiny">${esc(e.error_traer)}</span></p>` : ''}` : ''}
    <p class="tiny mut">${e.con_avisos ? 'Con servidor: además, Tiendanube avisa cada venta al instante a ' + esc(e.url_avisos) + '.' : 'Sin servidor: la app trae las ventas cuando está prendida. Si estuvo apagada, al prenderla se pone al día.'}
      Productos traídos por última vez: ${fecha(e.ultima_importacion)}.</p>
    <div class="row">
      ${e.conectada ? '<button class="pri" id="bTraer">Traer ventas ahora</button>' : ''}
      ${e.configurada ? `<button class="${e.conectada ? '' : 'pri'}" id="bInstalar">${e.conectada ? 'Volver a conectar' : 'Conectar la tienda'}</button>` : ''}
      ${e.conectada ? `<button id="bImportar">Traer productos de Tiendanube</button><button id="bRevisar">Revisar conexión</button><button id="bDif">Comparar stock</button>` : ''}
      <button id="bSimular">Simular venta web</button>
    </div>
    <div id="pegar" style="display:none;margin-top:14px" class="card">
      <p style="margin-top:0"><b>Se abrió Tiendanube en otra pestaña.</b> Aceptá la app ahí. Si después ves una página que dice "listo", ya está. Si ves un error o una página que no carga, <b>copiá la dirección completa</b> de esa pestaña (la que tiene <code>code=</code>) y pegala acá:</p>
      <div class="row"><input id="codigo" placeholder="Pegá acá la dirección con code=…" style="flex:1 1 180px;min-width:0"><button class="pri" id="bCodigo">Conectar</button></div></div>
    ${e.conectada ? `<details style="margin-top:14px"><summary class="tiny">Traer ventas desde una fecha (por ejemplo, para cargar meses anteriores)</summary>
      <div class="row" style="margin-top:8px"><input type="date" id="desdeF" style="width:auto"><button id="bTraerDesde">Traer</button></div>
      <p class="tiny mut">Las ventas de antes de conectar la tienda se cargan para los reportes, pero no tocan el stock (Tiendanube ya las tenía descontadas).</p></details>` : ''}
    <div id="dif" style="margin-top:12px"></div></div>
  ${!e.con_avisos && !avs.length ? '' : `<div class="card"><h2>Últimos avisos de Tiendanube</h2>${avs.length ? `<div class="tablebox"><table><thead><tr><th>Llegó</th><th>Aviso</th><th>Estado</th><th></th></tr></thead><tbody>
    ${avs.map(a => `<tr><td class="tiny">${fecha(a.recibido_ts)}</td><td>${esc(a.evento)} ${a.recurso_id ? '<span class="mut">' + esc(a.recurso_id) + '</span>' : ''}</td>
    <td><span class="tag ${a.estado === 'hecho' ? 'ok' : a.estado === 'ignorado' ? '' : 'warn'}">${esc(a.estado)}</span>${a.ultimo_error ? `<div class="tiny mut">${esc(a.ultimo_error)}</div>` : ''}</td>
    <td>${a.estado === 'error' ? `<button class="small" data-re="${a.id}">Reintentar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>` : '<p class="mut">Todavía no llegó ningún aviso.</p>'}</div>`}`;
  const on = (id, fn) => { const b = $(id); if (b) b.onclick = async () => { b.disabled = true; try { await fn(); } catch (e) { fallo(e); } b.disabled = false; }; };
  on('#bInstalar', async () => { const r = await api('/api/instalar', 'POST'); if (e.con_avisos) { location.href = r.url; return; } window.open(r.url, '_blank', 'noopener'); $('#pegar').style.display = 'block'; });
  on('#bCodigo', async () => { const r = await api('/api/instalar/codigo', 'POST', { codigo: $('#codigo').value.trim() }); S.productos = null; toast(r.mensaje); conexion(); });
  const traer = async desde => { const r = await api('/api/traer-pedidos', 'POST', desde ? { desde_ms: desde } : {}); S.productos = null; toast(r.ok ? `Listo: ${r.nuevas} venta(s) nueva(s)${r.anuladas ? ', ' + r.anuladas + ' cancelada(s)' : ''}` : 'Ya se estaban trayendo, probá en un ratito'); conexion(); };
  on('#bTraer', () => traer());
  on('#bTraerDesde', () => { const v = $('#desdeF').value; if (!v) return toast('Elegí una fecha'); return traer(+new Date(v + 'T00:00')); });
  on('#bImportar', async () => { const r = await api('/api/productos/importar', 'POST'); S.productos = null; toast(`Listo: ${r.nuevos} nuevos, ${r.actualizados} actualizados`); });
  on('#bRevisar', async () => { const r = await api('/api/revisar-conexion', 'POST'); toast(`Conexión bien. Avisos: ${r.avisos.join(', ') || 'falta URL pública'}. Stock enviado: ${r.enviados}`); });
  on('#bSimular', async () => { const r = await api('/api/simular-pedido', 'POST'); S.productos = null; toast('Venta de prueba registrada (N° ' + r.venta_id + '). Mirala en Ventas.'); });
  on('#bDif', async () => {
    const d = await api('/api/diferencias');
    $('#dif').innerHTML = d.length ? `<p><b>${d.length} producto(s) con stock distinto</b></p><table><thead><tr><th>Producto</th><th class="r">Acá</th><th class="r">Tiendanube</th></tr></thead><tbody>${d.map(x => `<tr><td>${esc(x.nombre)}</td><td class="r">${fq(x.aca)}</td><td class="r">${esc(x.tiendanube ?? 'sin límite')}</td></tr>`).join('')}</tbody></table>
      <p><button class="pri" id="bSync">Mandar el stock de acá a Tiendanube</button></p>` : '<p class="tag ok">El stock coincide en todos los productos.</p>';
    on('#bSync', async () => { const r = await api('/api/sincronizar', 'POST'); toast(`Enviados ${r.enviados}${r.errores ? ', con ' + r.errores + ' error(es)' : ''}`); $('#dif').innerHTML = ''; });
  });
  document.querySelectorAll('[data-re]').forEach(b => b.onclick = async () => { try { await api(`/api/avisos/${b.dataset.re}/reintentar`, 'POST'); render(); } catch (e) { fallo(e); } });
}

aplicarFiestas();
render();
</script>
</body>
</html>

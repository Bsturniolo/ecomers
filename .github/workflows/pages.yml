name: Publicar páginas

# Publica el repo tal cual: la tienda queda en la raíz (index.html) y el panel de muestra en /admin/.
# Sirve igual si en Settings → Pages está elegido "GitHub Actions" o "Deploy from a branch" (main, raíz).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
